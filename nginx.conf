server {
    listen 80;
    server_name shop.bravexgroup.eu;
    root /root/bravex-shop/dist;
    index index.html;

    # Статические ассеты - отдаём напрямую с кешированием
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Отключаем кеш для HTML
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Для динамических роутов товаров: /catalog/product/{slug}
    location ~ ^/catalog/product/.+$ {
        try_files $uri /catalog/product/index.html;
    }

    # Для динамических роутов постов: /blog/post/{slug}
    location ~ ^/blog/post/.+$ {
        try_files $uri /blog/post/index.html;
    }

    # Для динамических роутов категорий: /catalog/{category-slug}
    # Исключаем /catalog/product чтобы не перехватывать его
    location ~ ^/catalog/(?!product)[^/]+/?$ {
        try_files $uri /catalog/index.html;
    }

    # Для вложенных страниц cart (checkout, checkout2, checkout-thanks)
    location ~ ^/cart/(checkout|checkout2|checkout-thanks)/?$ {
        try_files $uri /cart/$1/index.html;
    }

    # Страницы первого уровня с index.html
    location = /blog {
        try_files $uri /blog/index.html;
    }
    location = /blog/ {
        try_files $uri /blog/index.html;
    }
    location = /cart {
        try_files $uri /cart/index.html;
    }
    location = /cart/ {
        try_files $uri /cart/index.html;
    }
    location = /catalog {
        try_files $uri /catalog/index.html;
    }
    location = /catalog/ {
        try_files $uri /catalog/index.html;
    }
    location = /contacts {
        try_files $uri /contacts/index.html;
    }
    location = /contacts/ {
        try_files $uri /contacts/index.html;
    }
    location = /returns {
        try_files $uri /returns/index.html;
    }
    location = /returns/ {
        try_files $uri /returns/index.html;
    }
    location = /category {
        try_files $uri /category/index.html;
    }
    location = /category/ {
        try_files $uri /category/index.html;
    }

    # Главная страница и fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}